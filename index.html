<style>
/* Inkcircle: a writer's desk. One rail, one working surface.
   Pages for writing, index cards for ideas, ink rings for people and circles.
   Blue-black ink on card stock; the index card's red rule marks what you're working on. */
:root {
  --desk: #E5E9EE;
  --card: #FCFCFA;
  --card-2: #F1F3F6;
  --ink: #1D2840;
  --ink-2: #536079;
  --ink-3: #7F8BA2;
  --rule: #C6D5E7;
  --line: #D6DCE4;
  --red: #C7303C;
  --red-ink: #FFFFFF;
  --red-soft: #F7E1E2;
  --hi: #F7E39A;
  --hi-ink: #2B2510;
  --focus: #2F5FB3;
  --ok: #2F7D4F;
  --shadow: 29, 40, 64;
  --scrim: rgba(18, 24, 40, .44);
  --c0: #1D2840; --c1: #C7303C; --c2: #2F8551; --c3: #2F5FB3;
  --c4: #7A4FB5; --c5: #A85A1F; --c6: #0E7C86; --c7: #9C3A6E;
  --k-idea: #B88A00; --k-character: #C7303C; --k-place: #2F8551;
  --k-plot: #2F5FB3; --k-question: #7A4FB5; --k-note: #6B7486;
  --display: "Alegreya", "Noto Serif Devanagari", "Iowan Old Style", Georgia, serif;
  --ui: "Alegreya Sans", "Mukta", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0E1422; --card: #161F33; --card-2: #1D2840; --ink: #E7EBF2; --ink-2: #A6B1C6; --ink-3: #75819B;
    --rule: #2A3956; --line: #28334C; --red: #EF6670; --red-ink: #1A0F14; --red-soft: #3A1F2B;
    --hi: #4A3F17; --hi-ink: #F5EBC4; --focus: #8FB3F5; --ok: #5CC28A; --shadow: 0, 0, 0; --scrim: rgba(4, 7, 14, .62);
    --c0: #9FB2D8; --c1: #EF6670; --c2: #5CC28A; --c3: #6E9BEA; --c4: #B08BE8; --c5: #E0985A; --c6: #3FC0C9; --c7: #DB7AAE;
    --k-idea: #E2B93B; --k-character: #EF6670; --k-place: #5CC28A; --k-plot: #6E9BEA; --k-question: #B08BE8; --k-note: #98A2B6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0E1422; --card: #161F33; --card-2: #1D2840; --ink: #E7EBF2; --ink-2: #A6B1C6; --ink-3: #75819B;
  --rule: #2A3956; --line: #28334C; --red: #EF6670; --red-ink: #1A0F14; --red-soft: #3A1F2B;
  --hi: #4A3F17; --hi-ink: #F5EBC4; --focus: #8FB3F5; --ok: #5CC28A; --shadow: 0, 0, 0; --scrim: rgba(4, 7, 14, .62);
  --c0: #9FB2D8; --c1: #EF6670; --c2: #5CC28A; --c3: #6E9BEA; --c4: #B08BE8; --c5: #E0985A; --c6: #3FC0C9; --c7: #DB7AAE;
  --k-idea: #E2B93B; --k-character: #EF6670; --k-place: #5CC28A; --k-plot: #6E9BEA; --k-question: #B08BE8; --k-note: #98A2B6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--desk); color: var(--ink);
  font-family: var(--ui); font-size: 16px; line-height: 1.5;
  overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums lining-nums; }

/* ---------- shell ---------- */
#app { display: flex; height: 100%; }
#rail { display: none; }
#col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
#topbar {
  display: flex; align-items: center; gap: 10px; flex: none;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px 14px;
  background: var(--card); border-bottom: 1px solid var(--line);
}
#topbar .grow { flex: 1; }
#main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
#main.fill { overflow: hidden; }
#tabbar {
  display: grid; grid-template-columns: repeat(5, 1fr); flex: none;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 2px 7px; border: 0; background: none; color: var(--ink-3);
  font-size: 12px; position: relative; cursor: pointer;
}
.tab .ico { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: -1px; left: 24%; right: 24%; height: 2px; background: var(--red);
}
body.focus #topbar, body.focus #tabbar { display: none; }

#notice:empty { display: none; }
#notice {
  flex: none; display: flex; gap: 10px; align-items: center;
  padding: 8px 16px; font-size: 14.5px; background: var(--hi); color: var(--hi-ink);
}
#notice .ico { width: 18px; height: 18px; }

@media (min-width: 900px) {
  #rail {
    display: flex; flex-direction: column; width: 244px; flex: none;
    background: var(--card); border-right: 1px solid var(--line);
    padding: 22px 14px 14px; overflow-y: auto;
  }
  #topbar, #tabbar { display: none; }
  body.focus #rail { width: 68px; padding: 18px 10px; }
  body.focus #rail .word, body.focus #rail .nav-item span:not(.ico),
  body.focus #rail .rail-sec, body.focus #rail .me-btn > span:last-child { display: none; }
  body.focus #rail .me-btn { justify-content: center; padding: 6px 0; }
  body.focus #rail .nav-item { justify-content: center; padding: 10px 0; }
  body.focus #rail .nav-item[aria-current="page"]::before { left: -10px; }
}

/* ---------- brand ---------- */
.brand {
  display: inline-flex; align-items: center; gap: 8px; color: var(--ink);
  background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none;
}
.mark { width: 30px; height: 30px; color: var(--red); flex: none; }
.brand .word {
  font-family: var(--display); font-style: italic; font-weight: 800;
  font-size: 25px; letter-spacing: -0.01em; line-height: 1;
}
.mark.draw path { animation: ink-draw 1.2s cubic-bezier(.65, .05, .3, 1) both; }
.mark.draw path + path { animation-delay: .9s; animation-duration: .35s; }
@keyframes ink-draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.mark path { stroke-dasharray: 100 100; }

/* ---------- rail ---------- */
.nav { display: flex; flex-direction: column; gap: 2px; margin: 26px 0 8px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 6px;
  color: var(--ink-2); background: none; border: 0; cursor: pointer; font-size: 16px;
  text-align: left; position: relative; width: 100%;
}
.nav-item:hover { background: var(--card-2); color: var(--ink); }
.nav-item[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--card-2); }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px;
  background: var(--red); border-radius: 0 2px 2px 0;
}
.rail-sec { margin-top: 18px; }
.rail-h { font-size: 13.5px; color: var(--ink-3); margin: 0 10px 6px; }
.rail-link {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; width: 100%;
  background: none; border: 0; cursor: pointer; text-align: left; color: var(--ink-2); font-size: 15px;
}
.rail-link:hover { background: var(--card-2); color: var(--ink); }
.rail-link .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.me-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%; }
.me-btn:hover { background: var(--card-2); }
.me-name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; box-shadow: 0 0 0 3px var(--red-soft); }

/* ---------- layout ---------- */
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 56px; }
@media (min-width: 900px) { .wrap { padding: 34px 40px 72px; } }
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 22px; }
.vh h1, .title-xl {
  font-family: var(--display); font-weight: 800; font-size: clamp(30px, 4.4vw, 42px);
  line-height: 1.06; margin: 0; letter-spacing: -0.012em;
}
.vh .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.sub { color: var(--ink-2); margin: 6px 0 0; }
.crumb {
  display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); background: none; border: 0;
  padding: 4px 6px 4px 0; cursor: pointer; font-size: 15px; margin-bottom: 8px;
}
.crumb:hover { color: var(--ink); }
.crumb .ico { width: 18px; height: 18px; }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-h h2 { font-family: var(--display); font-size: 23px; font-weight: 700; margin: 0; line-height: 1.2; }
.sec-h .more { background: none; border: 0; color: var(--ink-2); cursor: pointer; font-size: 15px; padding: 4px 0; }
.sec-h .more:hover { color: var(--ink); text-decoration: underline; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.loading { color: var(--ink-3); padding: 18px 2px; }
.split { display: grid; gap: 30px; }
@media (min-width: 1000px) { .split { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; gap: 40px; } }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-weight: 500; cursor: pointer;
  text-decoration: none; white-space: nowrap; font-size: 15.5px;
}
.btn:hover { border-color: var(--ink-3); }
.btn .ico { width: 18px; height: 18px; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--red-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--card); font-weight: 700; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--card-2); }
.btn.small { min-height: 32px; padding: 4px 11px; font-size: 14.5px; }
.btn.danger { color: var(--red); }
.btn:disabled, .ibtn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.ibtn {
  width: 40px; height: 40px; display: inline-grid; place-items: center; flex: none;
  border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; position: relative;
}
.ibtn:hover { background: var(--card-2); color: var(--ink); }
.ibtn[aria-pressed="true"] { background: var(--card-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--red); }
.ibtn .badge {
  position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px;
  background: var(--red); color: var(--red-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px;
}
.ico { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ico svg { width: 100%; height: 100%; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  font-size: 14.5px; cursor: pointer; color: var(--ink-2); line-height: 1.4;
}
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.chip .n { opacity: .7; margin-left: 4px; }
.tag { display: inline-block; font-size: 13px; padding: 2px 9px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); line-height: 1.5; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.pill .ico { width: 15px; height: 15px; }
.live {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700;
  color: var(--red); white-space: nowrap;
}
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px var(--red-soft); }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field > .lbl { font-weight: 700; font-size: 14.5px; }
.hint { color: var(--ink-3); font-size: 13.5px; }
.inp {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink); min-height: 42px;
}
.inp:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
textarea.inp { resize: vertical; line-height: 1.5; }
select.inp { appearance: auto; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw {
  width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--card); background: var(--swc);
  box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0;
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.radios { display: grid; gap: 8px; }
.radio {
  display: flex; gap: 10px; align-items: center; padding: 11px 12px; text-align: left; width: 100%;
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--card);
}
.radio .ico { color: var(--ink-3); }
.radio[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--red); }
.radio[aria-checked="true"] .ico { color: var(--ink); }
.radio b { display: block; font-weight: 700; }
.radio small { color: var(--ink-2); font-size: 13.5px; }

/* ---------- people ---------- */
.av { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex: none; background: var(--card-2); display: inline-block; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--red); }
.stack { display: flex; align-items: center; }
.stack .av { margin-left: -8px; box-shadow: 0 0 0 2px var(--card); }
.stack .av:first-child { margin-left: 0; }
.stack .av.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--red); }
.stack .more-n { margin-left: 8px; font-size: 13.5px; color: var(--ink-2); }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit; }
.person .nm { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .what { display: block; font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.people-list { display: flex; flex-direction: column; gap: 12px; }

.ringmark { position: relative; display: inline-grid; place-items: center; flex: none; }
.ringmark svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ringmark b { font-family: var(--display); font-weight: 800; font-size: 0.46em; line-height: 1; position: relative; }

/* ---------- lists ---------- */
.rows { background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.row {
  display: flex; gap: 14px; align-items: center; padding: 14px 16px; width: 100%; text-align: left;
  border: 0; border-top: 1px solid var(--line); background: none; color: inherit; cursor: pointer; text-decoration: none;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--card-2); }
.row .grow { flex: 1; min-width: 0; }
.row .right { display: flex; align-items: center; gap: 10px; flex: none; }
.spine { width: 6px; align-self: stretch; border-radius: 2px; flex: none; min-height: 44px; }
.r-title { font-family: var(--display); font-weight: 700; font-size: 19.5px; line-height: 1.22; overflow: hidden; text-overflow: ellipsis; }
.r-meta { color: var(--ink-2); font-size: 14.5px; margin-top: 2px; }
.r-line { color: var(--ink-2); font-size: 14.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; font-style: italic; font-family: var(--display); }
.prog { height: 4px; background: var(--card-2); border-radius: 2px; overflow: hidden; width: 100%; }
.prog > i { display: block; height: 100%; background: var(--red); border-radius: 2px; }
.chapter-n { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--ink-3); width: 30px; text-align: right; flex: none; font-variant-numeric: lining-nums tabular-nums; }

.empty {
  border: 1.5px dashed var(--line); border-radius: 8px; padding: 22px; color: var(--ink-2);
  display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
}
.empty p { margin: 0; max-width: 48ch; }
.empty .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- desk ---------- */
.greet h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 4.6vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -0.012em; }
.today { display: flex; align-items: flex-end; gap: 14px; margin-top: 10px; color: var(--ink-2); }
.today b { color: var(--ink); font-size: 17px; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
.bars i { width: 7px; background: var(--rule); border-radius: 1px; min-height: 2px; display: block; }
.bars i.t { background: var(--red); }

.ms {
  background: var(--card); border-radius: 4px; border-top: 3px solid var(--red);
  box-shadow: 0 1px 0 rgba(var(--shadow), .05), 0 22px 48px -32px rgba(var(--shadow), .6);
  padding: 20px 22px 18px; position: relative;
}
.ms-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ms-proj { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.15; margin: 0; }
.ms-ch { color: var(--ink-2); margin-top: 2px; }
.ms-ex {
  font-family: var(--display); font-size: 18px; line-height: 32px; margin: 14px 0 16px; color: var(--ink);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  max-height: 160px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 46%); mask-image: linear-gradient(to bottom, transparent 0, #000 46%);
  display: flex; flex-direction: column; justify-content: flex-end; min-height: 128px;
}
.ms-ex p { margin: 0; }
.ms-ex .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--red); vertical-align: -0.15em; margin-left: 2px; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ms-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ms-blank { font-family: var(--display); font-size: 20px; line-height: 32px; color: var(--ink-2); font-style: italic; margin: 14px 0 16px; background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); min-height: 96px; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.panel + .panel { margin-top: 16px; }
.panel h3 { font-family: var(--display); font-size: 19px; margin: 0 0 12px; }
.sprint-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.sprint-line:first-of-type { border-top: 0; padding-top: 0; }
.sprint-line .grow { flex: 1; min-width: 0; }
.sprint-line .clk { font-weight: 700; font-variant-numeric: tabular-nums lining-nums; font-size: 18px; }
.owner-tip { border-left: 3px solid var(--red); }
.owner-tip ol { margin: 8px 0 12px; padding-left: 20px; }
.owner-tip li { margin-bottom: 6px; }

.cgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.ccard {
  display: flex; gap: 14px; align-items: flex-start; padding: 16px; background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; text-align: left; cursor: pointer; color: inherit; width: 100%;
}
.ccard:hover { border-color: var(--ink-3); }
.ccard .grow { flex: 1; min-width: 0; }
.ccard .nm { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.2; }
.ccard .ab { color: var(--ink-2); font-size: 14.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ccard .mt { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 13.5px; color: var(--ink-2); }
.ccard .last { font-size: 14px; margin-top: 8px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- sheets & toasts ---------- */
#overlay { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#overlay.on { pointer-events: auto; }
.sheet-wrap { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .16s ease-out; }
.sheet {
  background: var(--card); width: 100%; max-height: 92%; display: flex; flex-direction: column;
  border-radius: 14px 14px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .28);
  animation: rise .24s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom);
}
@media (min-width: 700px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { width: min(560px, 100%); border-radius: 12px; max-height: 88%; }
  .sheet.lg { width: min(780px, 100%); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 10px 4px 20px; }
.sheet-title { font-family: var(--display); font-size: 23px; font-weight: 800; margin: 0; line-height: 1.2; outline: none; }
.sheet-body { padding: 8px 20px 18px; overflow-y: auto; min-height: 0; }
.sheet-body > p:first-child { margin-top: 0; }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.pick-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pick-list .row { padding: 11px 14px; }

#toasts {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 70;
  bottom: calc(78px + env(safe-area-inset-bottom)); width: min(92vw, 470px);
  display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
}
body.focus #toasts { top: calc(env(safe-area-inset-top) + 64px); bottom: auto; }
@media (min-width: 900px) { #toasts { bottom: 24px; } }
.toast {
  pointer-events: auto; background: var(--ink); color: var(--card); padding: 10px 14px; border-radius: 8px;
  display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 26px rgba(0, 0, 0, .28); font-size: 15px;
  animation: rise .2s ease-out; transition: opacity .3s, transform .3s; max-width: 100%;
}
.toast.out { opacity: 0; transform: translateY(6px); }
.toast.error { background: var(--red); color: var(--red-ink); }
.toast-act { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; }

/* ---------- full-height work views ---------- */
.work { display: flex; flex-direction: column; height: 100%; }
.work-head {
  display: flex; align-items: center; gap: 4px; flex: none;
  padding: calc(env(safe-area-inset-top) + 6px) 8px 6px; border-bottom: 1px solid var(--line); background: var(--card);
}
.work-head .ttl { flex: 1; min-width: 0; padding: 0 6px; }
.work-head .ttl b { display: block; font-family: var(--display); font-size: 18.5px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-head .ttl small { display: block; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-banner { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--red-soft); font-size: 14.5px; flex: none; flex-wrap: wrap; }
.work-banner .grow { flex: 1; min-width: 180px; }

/* ---------- editor ---------- */
.ed-title-in {
  width: 100%; font-family: var(--display); font-size: 18.5px; font-weight: 800; border: 0; background: transparent;
  padding: 4px 6px; border-radius: 6px; text-overflow: ellipsis; color: var(--ink);
}
.ed-title-in:focus { background: var(--card-2); outline: none; }
.ed-status { font-size: 13px; color: var(--ink-3); white-space: nowrap; padding: 0 4px; }
.ed-status.warn { color: var(--red); font-weight: 700; }
.ed-tools {
  display: flex; align-items: center; gap: 2px; padding: 3px 8px; flex: none;
  border-bottom: 1px solid var(--line); background: var(--card); overflow-x: auto; scrollbar-width: none;
}
.ed-tools::-webkit-scrollbar { display: none; }
.ed-tools .sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; flex: none; }
.ed-tools .wc { margin-left: auto; font-size: 14px; color: var(--ink-2); white-space: nowrap; padding: 0 6px 0 12px; }
.ed-body { flex: 1; min-height: 0; display: flex; }
.ed-scroll { flex: 1; min-width: 0; overflow-y: auto; background: var(--desk); padding: 0 10px; }
.page {
  max-width: 46rem; margin: 16px auto 0; background: var(--card); min-height: 68vh; position: relative;
  padding: 34px 22px 64px; font-family: var(--display); font-size: 1.19rem; line-height: 1.72;
  outline: none; border-radius: 3px; caret-color: var(--red); overflow-wrap: break-word;
  box-shadow: 0 1px 0 rgba(var(--shadow), .05), 0 22px 54px -38px rgba(var(--shadow), .7);
}
@media (min-width: 700px) { .page { padding: 58px 66px 90px; margin-top: 30px; } }
.page p { margin: 0 0 .85em; }
.page h2 { font-size: 1.5em; margin: 1.1em 0 .45em; line-height: 1.2; }
.page h3 { font-size: 1.2em; margin: 1em 0 .4em; line-height: 1.25; }
.page blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--rule); color: var(--ink-2); }
.page hr { border: 0; text-align: center; margin: 1.5em 0; height: 1.3em; overflow: visible; }
.page hr::before { content: "* * *"; letter-spacing: .6em; color: var(--ink-3); }
.page figure { margin: 1.4em 0; }
.page figure img { margin: 0 auto; border-radius: 2px; max-height: 70vh; }
.page figcaption { font-size: .85em; color: var(--ink-2); text-align: center; font-style: italic; margin-top: .4em; }
.page ::selection { background: var(--hi); color: var(--hi-ink); }
.page.empty::before { content: attr(data-ph); position: absolute; color: var(--ink-3); font-style: italic; pointer-events: none; }
.page[contenteditable="false"] { caret-color: transparent; }
.page mark.found { background: var(--hi); color: var(--hi-ink); }
.ed-nav { max-width: 46rem; margin: 18px auto 40px; display: flex; justify-content: space-between; gap: 10px; }
.ed.zen .ed-tools, .ed.zen .work-banner { display: none; }
.ed.zen .page { box-shadow: none; }

.side {
  width: 370px; flex: none; border-left: 1px solid var(--line); background: var(--card);
  display: none; flex-direction: column; min-height: 0;
}
.ed.side-open .side { display: flex; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 6px 16px; }
.side-head h2 { font-family: var(--display); font-size: 21px; margin: 0; }
.side-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 18px; }
@media (max-width: 899px) {
  .side {
    position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: 64%; z-index: 30; border-left: 0;
    border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -14px 40px rgba(0, 0, 0, .28);
    padding-bottom: env(safe-area-inset-bottom);
  }
}
.note { border-top: 1px solid var(--line); padding: 12px 0; }
.note:first-child { border-top: 0; }
.note .q {
  display: block; width: 100%; text-align: left; border: 0; cursor: pointer; padding: 6px 10px; margin: 6px 0;
  font-family: var(--display); font-style: italic; background: var(--hi); color: var(--hi-ink); border-radius: 3px; font-size: 15px;
}
.note .t { white-space: pre-wrap; overflow-wrap: break-word; }
.note .acts { display: flex; gap: 6px; margin-top: 6px; }
.note.done { opacity: .62; }
.muse-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 12px; }
.muse-acts .btn { justify-content: flex-start; white-space: normal; text-align: left; line-height: 1.25; min-height: 46px; }
.muse-out {
  white-space: pre-wrap; overflow-wrap: break-word; font-size: 15.5px; line-height: 1.55; background: var(--card-2);
  border-radius: 8px; padding: 12px 14px; margin-top: 12px; border-left: 3px solid var(--k-question);
}
.muse-out:empty { display: none; }
.muse-note { font-size: 13.5px; color: var(--ink-3); margin-top: 10px; }
.ask-row { display: flex; gap: 8px; }
.ask-row .inp { flex: 1; }

/* ---------- brainstorm board ---------- */
.bd-view {
  flex: 1; position: relative; overflow: hidden; touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none; background-color: var(--desk);
  background-image: radial-gradient(circle, var(--rule) 1.1px, transparent 1.3px);
}
.bd-view.panning { cursor: grabbing; }
.bd-view.linking { cursor: crosshair; }
.bd-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.bd-links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.bd-links path { fill: none; stroke: var(--ink-3); stroke-width: 1.7; stroke-dasharray: 6 5; stroke-linecap: round; }
.icard {
  position: absolute; width: 224px; background: var(--card); border-radius: 3px;
  border-top: 4px solid var(--k, var(--k-note)); padding: 7px 12px 8px; cursor: pointer;
  box-shadow: 0 1px 0 rgba(var(--shadow), .08), 0 12px 24px -16px rgba(var(--shadow), .6);
}
.icard-k { font-size: 13px; color: var(--k); font-weight: 700; display: flex; justify-content: space-between; align-items: center; min-height: 22px; gap: 8px; }
.icard-k .by { display: flex; align-items: center; gap: 4px; }
.icard-k .av { width: 18px; height: 18px; }
.icard-t {
  font-family: var(--display); font-size: 16.5px; line-height: 26px; min-height: 78px; white-space: pre-wrap; overflow-wrap: break-word;
  background-image: repeating-linear-gradient(to bottom, transparent 0 25px, var(--rule) 25px 26px); color: var(--ink);
}
.icard-t.ph { color: var(--ink-3); font-style: italic; }
.icard textarea {
  display: block; width: 100%; border: 0; background: transparent; resize: none; padding: 0; outline: none;
  font-family: var(--display); font-size: 16.5px; line-height: 26px; min-height: 104px; color: var(--ink);
  background-image: repeating-linear-gradient(to bottom, transparent 0 25px, var(--rule) 25px 26px);
}
.icard-f { display: flex; justify-content: flex-end; align-items: center; gap: 4px; min-height: 22px; font-size: 13px; color: var(--ink-3); }
.icard-f .v { display: inline-flex; align-items: center; gap: 3px; }
.icard-f .v.on { color: var(--red); font-weight: 700; }
.icard-f .ico { width: 14px; height: 14px; }
.icard.sel { outline: 2px solid var(--ink); outline-offset: 3px; z-index: 4; }
.icard.drag { z-index: 6; box-shadow: 0 22px 44px -14px rgba(var(--shadow), .65); rotate: -1.2deg; }
.icard.remote { outline: 2px dashed var(--rc, var(--ink-3)); outline-offset: 3px; }
.icard.link-src { outline: 2px solid var(--k-plot); outline-offset: 3px; }
.cursor { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 20; display: flex; align-items: flex-start; gap: 2px; }
.cursor svg { width: 16px; height: 16px; }
.cursor span { color: #fff; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 4px; margin-top: 12px; white-space: nowrap; }
.bd-zoom {
  position: absolute; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 22px -12px rgba(var(--shadow), .5);
}
.bd-zoom .ibtn { width: 38px; height: 38px; }
.bd-zoom .z { font-size: 12px; text-align: center; color: var(--ink-2); padding: 2px 0; font-variant-numeric: tabular-nums; }
.bd-sel {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex; gap: 2px; background: var(--ink); border-radius: 12px; padding: 4px; max-width: calc(100% - 76px);
  overflow-x: auto; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .45); z-index: 25; scrollbar-width: none;
}
.bd-sel .ibtn { color: var(--card); }
.bd-sel .ibtn:hover, .bd-sel .ibtn[aria-pressed="true"] { background: rgba(255, 255, 255, .14); color: var(--card); box-shadow: none; }
.bd-hint {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--ink); color: var(--card);
  padding: 7px 14px; border-radius: 999px; font-size: 14px; z-index: 25; display: flex; gap: 10px; align-items: center; white-space: nowrap;
}
.bd-hint button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 700; padding: 0; }
.bd-empty { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; color: var(--ink-2); max-width: 300px; pointer-events: none; }
.bd-empty b { display: block; font-family: var(--display); font-size: 22px; color: var(--ink); margin-bottom: 6px; }
.kind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kind-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; border-top: 4px solid var(--k); }
.kind-btn[aria-pressed="true"] { border-color: var(--ink); border-top-color: var(--k); }
.spark-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.spark-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--k); border-radius: 6px; cursor: pointer; text-align: left; background: var(--card); width: 100%; }
.spark-item[aria-checked="false"] { opacity: .55; }
.spark-item .bx { width: 20px; height: 20px; border: 1.5px solid var(--ink-3); border-radius: 4px; flex: none; display: grid; place-items: center; margin-top: 2px; }
.spark-item[aria-checked="true"] .bx { background: var(--ink); border-color: var(--ink); color: var(--card); }
.spark-item .bx .ico { width: 14px; height: 14px; }
.spark-item small { display: block; color: var(--k); font-weight: 700; font-size: 12.5px; }
.spark-item span.tx { font-family: var(--display); font-size: 16px; line-height: 1.4; }

/* ---------- sketchbook ---------- */
.sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 22px 16px; }
.sk { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit; min-width: 0; }
.sk-img {
  aspect-ratio: 4 / 3; background: #fff; border-radius: 3px; overflow: hidden; display: grid; place-items: center;
  box-shadow: 0 0 0 1px var(--line), 0 10px 22px -18px rgba(var(--shadow), .7);
}
.sk-img img { width: 100%; height: 100%; object-fit: contain; }
.sk-cap { font-family: var(--display); font-style: italic; font-size: 16px; margin-top: 8px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sk-meta { font-size: 13.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sk-view { display: grid; gap: 26px; }
@media (min-width: 1000px) { .sk-view { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; } }
.sk-big { background: #fff; border-radius: 3px; box-shadow: 0 0 0 1px var(--line), 0 26px 60px -40px rgba(var(--shadow), .8); }
.sk-big img { width: 100%; height: auto; max-height: 76vh; object-fit: contain; }
.figcap { font-family: var(--display); font-style: italic; font-size: 18px; color: var(--ink-2); margin: 10px 0 0; }

.dr-stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; background: var(--desk); overflow: hidden; position: relative; }
.dr-canvas { background: #fff; touch-action: none; border-radius: 2px; cursor: crosshair; box-shadow: 0 0 0 1px var(--line), 0 24px 50px -34px rgba(var(--shadow), .8); }
.dr-dock {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; flex: none;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line);
}
.dr-group { display: flex; align-items: center; gap: 2px; }
.dr-dock .sw { width: 26px; height: 26px; border-width: 2px; }
.dr-dock input[type="range"] { width: 110px; accent-color: var(--red); }
.dr-dock input[type="color"] { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; cursor: pointer; overflow: hidden; }
.dr-size { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.orient { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.orient button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
.orient button:hover { border-color: var(--ink); }
.orient i { display: block; background: #fff; box-shadow: 0 0 0 1.5px var(--ink-3); border-radius: 2px; }

/* ---------- circles ---------- */
.cv-head { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 16px 0; flex: none; }
@media (min-width: 900px) { .cv-head { padding: 22px 32px 0; } }
.cv-top { display: flex; gap: 14px; align-items: flex-start; }
.cv-top .grow { flex: 1; min-width: 0; }
.cv-top h1 { font-family: var(--display); font-size: clamp(25px, 3.6vw, 34px); font-weight: 800; margin: 0; line-height: 1.1; }
.cv-top p { margin: 4px 0 0; color: var(--ink-2); max-width: 62ch; }
.cv-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 12px; color: var(--ink-2); font-weight: 500; position: relative; cursor: pointer; white-space: nowrap; font-size: 15.5px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--red); }
.tabs .live { margin-left: 4px; font-size: 12.5px; }
.cv-panel { flex: 1; min-height: 0; overflow-y: auto; }
.cv-panel.chat-mode { overflow: hidden; display: flex; flex-direction: column; }
.inner { max-width: 860px; margin: 0 auto; padding: 18px 16px 40px; }
@media (min-width: 900px) { .inner { padding: 24px 32px 48px; } }
.chat-list { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 10px; }
.chat-list > .day { text-align: center; font-size: 13px; color: var(--ink-3); margin: 14px 0 8px; }
.msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 10px; padding: 7px 0 1px; position: relative; }
.msg .av { width: 34px; height: 34px; grid-row: span 2; }
.msg .hd { display: flex; align-items: baseline; gap: 8px; }
.msg .who { font-weight: 700; font-size: 15px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
.msg time { color: var(--ink-3); font-size: 12.5px; }
.msg .txt { white-space: pre-wrap; overflow-wrap: break-word; font-size: 15.5px; }
.msg.cont { padding-top: 0; }
.msg.cont .av, .msg.cont .hd { display: none; }
.msg.cont .txt { grid-column: 2; }
.msg .x { position: absolute; right: 0; top: 2px; opacity: 0; width: 30px; height: 30px; }
.msg:hover .x, .msg .x:focus-visible { opacity: 1; }
.share-card {
  display: flex; gap: 12px; align-items: center; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); cursor: pointer; text-align: left; width: 100%; max-width: 420px; color: inherit;
}
.share-card:hover { border-color: var(--ink-3); }
.share-card .ico { color: var(--ink-2); }
.share-card b { display: block; font-family: var(--display); font-size: 17px; }
.share-card small { color: var(--ink-2); }

/* =====================================================================
   v2 additions: welcome page, create button, badges, loading states,
   onboarding, checklist, contents drawer
   ===================================================================== */
body.public #rail, body.public #topbar, body.public #tabbar, body.public #notice, body.public #fab { display: none !important; }
body.public #main { background: var(--desk); }
.boot { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 6px; padding: 40px; }
.boot .mark { width: 54px; height: 54px; }
.boot-err { max-width: 560px; padding-top: 18vh; }
.boot-err .mark { width: 40px; height: 40px; }

/* ---------- welcome page ---------- */
.land { min-height: 100%; overflow-x: hidden; }
.land-top, .hero, .pillars, .teaser, .steps, .closing, .land-foot { max-width: 1180px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
.land-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: calc(env(safe-area-inset-top) + 16px); padding-bottom: 8px; }
.land-nav { display: flex; align-items: center; gap: 18px; }
.land-link { color: var(--ink-2); text-decoration: none; font-weight: 500; }
.land-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.hero { display: grid; gap: 64px; align-items: center; padding-top: 30px; padding-bottom: 76px; }
.hero h1 {
  font-family: var(--display); font-weight: 800; font-size: clamp(42px, 6.6vw, 78px);
  line-height: .97; letter-spacing: -0.022em; margin: 0 0 22px; max-width: 15ch;
}
.lede { font-size: clamp(17.5px, 1.55vw, 19.5px); color: var(--ink-2); max-width: 46ch; margin: 0 0 30px; line-height: 1.6; }
.invite-note {
  display: flex; gap: 10px; align-items: center; background: var(--card); border-left: 3px solid var(--red);
  padding: 10px 14px; border-radius: 4px; margin: 0 0 22px; max-width: 46ch; font-weight: 500;
}
.invite-note .ico { color: var(--red); }
.cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn.big { min-height: 50px; padding: 12px 20px; font-size: 17px; border-radius: 10px; }
.btn.wide { width: 100%; }
.fine { color: var(--ink-3); font-size: 14.5px; margin: 16px 0 0; max-width: 54ch; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; font-weight: 700; }
.linkish:hover { color: var(--red); }

.scene { position: relative; padding: 26px 0 70px; max-width: 600px; justify-self: center; width: 100%; }
.sc-page {
  position: relative; background: var(--card); border-radius: 3px; border-top: 3px solid var(--red);
  box-shadow: 0 1px 0 rgba(var(--shadow), .06), 0 34px 70px -44px rgba(var(--shadow), .8);
  padding: 22px 24px 16px; margin-right: 19%; transform: rotate(-1.2deg);
}
.sc-page-h { margin-bottom: 8px; }
.sc-page-h b { display: block; font-family: var(--display); font-size: 20px; font-weight: 800; line-height: 1.25; }
.sc-page-h small { display: flex; gap: 12px; align-items: center; color: var(--ink-3); font-size: 13.5px; margin-top: 2px; }
.sc-p {

  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
}
.sc-p { padding-right: 18px; }
.sc-p.faded { color: var(--ink-2); }
.sc-p + .sc-p { min-height: 128px; }
.sc-p .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--red); vertical-align: -0.15em; margin-left: 1px; animation: blink 1.1s steps(2) infinite; }
.sc-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-3); font-size: 13.5px; margin-top: 12px; }
.sc-saved { display: inline-flex; gap: 4px; align-items: center; color: var(--ok); font-weight: 700; }

.sc-card {
  position: absolute; width: 184px; background: var(--card); border-top: 4px solid var(--k); border-radius: 2px;
  padding: 9px 12px 12px; box-shadow: 0 20px 36px -24px rgba(var(--shadow), .85); right: -14px; top: -4px; transform: rotate(4deg);
}

.sc-card p { margin: 3px 0 0; font-family: var(--display); font-size: 16px; line-height: 1.3; }
.sc-card.two { top: auto; bottom: 104px; right: -18px; transform: rotate(-3deg); }
.sc-sprint {
  position: absolute; left: -6px; bottom: 14px; background: #1D2840; color: #F4F6FA; border-radius: 10px;
  padding: 11px 14px 12px; box-shadow: 0 22px 40px -22px rgba(0, 0, 0, .65); transform: rotate(1.6deg); min-width: 248px;
}
:root[data-theme="dark"] .sc-sprint { background: #26324D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sc-sprint { background: #26324D; } }
.sc-sprint-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.sc-sprint .live { color: inherit; }
.sc-sprint .live::before { background: #FF6B76; box-shadow: 0 0 0 3px rgba(255, 107, 118, .25); }
.sc-clk { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; }
.sc-writers { display: flex; gap: 12px; margin-top: 8px; }
.sc-w { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; }
.sc-w i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 9.5px; font-weight: 800; color: #fff; }
.sc-sketch {
  position: absolute; right: 9%; bottom: -14px; width: 150px; background: #fff; padding: 6px 6px 16px;
  box-shadow: 0 20px 36px -24px rgba(var(--shadow), .85); transform: rotate(-5deg);
}

@media (max-width: 560px) {
  .land-link { display: none; }
  .scene { padding: 8px 0 86px; }
  .sc-page { margin-right: 0; padding: 18px 18px 14px; }
  .sc-p { padding-right: 0; }
  .sc-card, .sc-sketch { display: none; }

}
@media (max-width: 700px) {

  .cv-top p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cv-meta .tag { display: none; }
}
@media (min-width: 960px) {
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr); padding-top: 54px; padding-bottom: 104px; gap: 56px; padding-left: 32px; padding-right: 32px; }
  .land-top, .pillars, .teaser, .steps, .closing, .land-foot { padding-left: 32px; padding-right: 32px; }
}

.land-h { font-family: var(--display); font-weight: 800; font-size: clamp(29px, 3.6vw, 42px); line-height: 1.08; margin: 0 0 28px; letter-spacing: -0.012em; }
.pillars { padding-top: 24px; padding-bottom: 72px; }

@media (min-width: 700px) { .pillar-grid { grid-template-columns: 1fr 1fr; gap: 26px 28px; } }
@media (min-width: 1100px) { .pillar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pillar { background: var(--card); border-top: 4px solid var(--k); border-radius: 2px; padding: 14px 18px 18px; box-shadow: 0 22px 44px -36px rgba(var(--shadow), .9); }
.pillar h3 { font-family: var(--display); font-weight: 800; font-size: 25px; line-height: 34px; margin: 0 0 4px; color: var(--k); }
.pillar p {
  margin: 0; color: var(--ink); line-height: 28px; font-size: 16px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
}
.steps { padding-top: 64px; padding-bottom: 72px; border-top: 1px solid var(--line); }
.step-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 26px; }

.step-list li { display: flex; gap: 16px; align-items: flex-start; }
.step-n { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: .86; color: var(--red); flex: none; min-width: 30px; font-variant-numeric: lining-nums; }
.step-list h3 { font-family: var(--display); font-size: 23px; margin: 0 0 4px; line-height: 1.15; }
.step-list p { margin: 0; color: var(--ink-2); max-width: 34ch; }
.band {
  background: #1D2840; color: #F3F5F9; display: grid; gap: 14px 52px; align-items: center;

}
@media (min-width: 860px) { .band { grid-template-columns: auto minmax(0, 1fr); } }
:root[data-theme="dark"] .band { background: #161F33; border-block: 1px solid #28334C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .band { background: #161F33; border-block: 1px solid #28334C; } }
.band-clock { font-family: var(--display); font-weight: 800; font-size: clamp(88px, 13vw, 172px); line-height: .82; letter-spacing: -0.04em; color: #FF6B76; }
.band-copy h2 { font-family: var(--display); font-size: clamp(29px, 3.4vw, 42px); margin: 0 0 12px; line-height: 1.08; font-weight: 800; }
.band-copy p { margin: 0; color: #C9D2E3; max-width: 52ch; font-size: 17.5px; line-height: 1.6; }
.closing { padding-top: 80px; padding-bottom: 84px; }
.closing h2 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 5.4vw, 62px); margin: 0 0 22px; letter-spacing: -0.018em; line-height: 1; }
.land-foot { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 14.5px; padding-top: 22px; padding-bottom: calc(env(safe-area-inset-bottom) + 30px); }
.land-foot .mark { width: 24px; height: 24px; }
.land-foot p { margin: 0; }

/* ---------- create button (phones) ---------- */
#fab { display: none; }
#fab.on {
  display: grid; place-items: center; position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 74px);
  width: 56px; height: 56px; border-radius: 16px; background: var(--red); color: var(--red-ink); border: 0; z-index: 20; cursor: pointer;
  box-shadow: 0 14px 28px -12px rgba(var(--shadow), .85);
}

@media (min-width: 900px) { #fab.on { display: none; } }
@media (max-width: 899px) { .hide-sm { display: none !important; } .wrap { padding-bottom: 104px; } }

/* ---------- badges, unread ---------- */
.nav-badge, .tab-badge { display: none; }
.nav-badge.on { display: inline-grid; place-items: center; margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: var(--red-ink); font-size: 12px; font-weight: 800; }
.tab-badge.on { display: grid; place-items: center; position: absolute; top: 4px; left: calc(50% + 5px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red); color: var(--red-ink); font-size: 11px; font-weight: 800; }
.unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--focus); flex: none; display: inline-block; margin-left: 7px; vertical-align: middle; }

.ccard.unread { border-color: var(--ink-3); }
.av-btn { background: none; border: 0; padding: 0; margin-right: 4px; cursor: pointer; border-radius: 50%; }
.tab-n { margin-left: 6px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--red); color: var(--red-ink); font-size: 11.5px; font-weight: 800; display: inline-grid; place-items: center; }

/* ---------- loading, empty ---------- */
.skel {
  display: block; border-radius: 4px; background: var(--card-2);
  background-image: linear-gradient(90deg, transparent 0, color-mix(in srgb, var(--card) 70%, transparent) 50%, transparent 100%);
  background-size: 200% 100%; background-repeat: no-repeat; animation: shimmer 1.3s ease-in-out infinite;
}
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.skel-list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.skel-row { display: flex; gap: 14px; padding: 16px; border-top: 1px solid var(--line); align-items: center; }
.skel-row:first-child { border-top: 0; }
.sk-img.skel { aspect-ratio: 4 / 3; }
.empty-art { width: 120px; height: 80px; }
.empty-art svg { width: 100%; height: 100%; }
#main.enter { animation: view-in .22s ease-out; }
@keyframes view-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- desk checklist ---------- */
.check-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.check-h h3 { margin: 0 0 8px; }
.check-list { list-style: none; margin: 0 0 6px; padding: 0; }
.check-list button { display: flex; gap: 10px; align-items: center; width: 100%; padding: 7px 0; background: none; border: 0; text-align: left; cursor: pointer; color: var(--ink); font-size: 15.5px; }
.check-list button:hover:not(:disabled) span:last-child { text-decoration: underline; text-underline-offset: 3px; }
.check-list .box { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; }
.check-list .box .ico { width: 14px; height: 14px; }
.check-list li.ok button { color: var(--ink-3); cursor: default; }
.check-list li.ok span:last-child { text-decoration: line-through; }
.check-list li.ok .box { background: var(--ok); border-color: var(--ok); color: #fff; }

/* ---------- sheets, onboarding, small pieces ---------- */
.sheet-sub { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
.mini-h { font-size: 14.5px; font-weight: 700; margin: 18px 0 8px; color: var(--ink-2); }
.signin { display: flex; flex-direction: column; gap: 10px; }
.sent { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.sent .ico { width: 34px; height: 34px; color: var(--red); }
.sent p { margin: 6px 0 0; }
.onb-dots { display: flex; gap: 6px; margin: -2px 0 18px; }

.onb-opt.pick { box-shadow: inset 3px 0 0 var(--red); }

.acts-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.danger-zone { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.big-num { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; }
.row-flat { display: flex; align-items: center; gap: 10px; }
.logline { font-family: var(--display); font-style: italic; }
.sk-grid.tight { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sk-grid.tight .sk-cap, .sk-grid.tight .sk-meta { display: none; }
.me-name { display: block; }
.link-box { display: flex; gap: 10px; align-items: center; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card-2); font-size: 14.5px; margin-bottom: 4px; }
.link-box .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cv-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.msg.sys .txt { color: var(--ink-2); font-style: italic; }
.sprint-total { font-family: var(--display); font-size: 24px; margin: 0; }

.icard-kinds button { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); cursor: pointer; line-height: 1.5; }

.page img.loading-img { min-height: 120px; min-width: 160px; background: var(--card-2); }

/* =====================================================================
   v3 additions: scheduled sprints, streak, reactions, report and block,
   privacy page, install, Marathi and Hindi
   ===================================================================== */
/* Devanagari needs room for its marks, and no negative tracking */
:root:lang(mr), :root:lang(hi) { --ui: "Mukta", "Alegreya Sans", "Segoe UI", system-ui, sans-serif; --display: "Noto Serif Devanagari", "Alegreya", Georgia, serif; }
:root:lang(mr) h1, :root:lang(mr) h2, :root:lang(mr) h3, :root:lang(hi) h1, :root:lang(hi) h2, :root:lang(hi) h3 { letter-spacing: 0; line-height: 1.3; }
:root:lang(mr) .hero h1, :root:lang(hi) .hero h1 { font-size: clamp(36px, 5.2vw, 62px); line-height: 1.22; max-width: 18ch; }
:root:lang(mr) .closing h2, :root:lang(hi) .closing h2, :root:lang(mr) .greet h1, :root:lang(hi) .greet h1 { line-height: 1.25; }
:root:lang(mr) .brand .word, :root:lang(hi) .brand .word { font-family: "Alegreya", Georgia, serif; }
:root:lang(mr) .btn, :root:lang(hi) .btn, :root:lang(mr) .chip, :root:lang(hi) .chip { line-height: 1.5; }

.soon { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; color: var(--focus); white-space: nowrap; }
.soon .ico { width: 15px; height: 15px; }
.sprint-line .soon-clk { color: var(--ink-2); }
.tab-when { margin-left: 6px; font-size: 12.5px; color: var(--focus); font-weight: 700; }
.streak { display: inline-flex; align-items: center; gap: 5px; margin-left: 0; padding: 2px 10px 2px 7px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; color: var(--ok); white-space: nowrap; align-self: center; }
.streak .ico { width: 14px; height: 14px; }
.today { flex-wrap: wrap; row-gap: 8px; }
.btn.wa .ico { width: 17px; height: 17px; }
a.btn { text-decoration: none; }
.loves { border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; background: var(--card); }
.loves-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; }
.loves-h > .ico { color: var(--red); width: 18px; height: 18px; }
.loves .q { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; padding: 6px 10px; margin: 8px 0 0; font-family: var(--display); font-style: italic; background: var(--red-soft); color: var(--ink); border-radius: 3px; font-size: 15px; }
.loves-n { display: inline-flex; align-items: center; gap: 4px; color: var(--red); font-size: 13.5px; font-weight: 700; flex: none; }
.loves-n .ico { width: 15px; height: 15px; }
.ed-tools .ibtn[aria-pressed="true"] { color: var(--red); }
.steps-ol { margin: 0; padding-left: 22px; }
.steps-ol li { margin-bottom: 8px; }
.land-lang { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 8px; font-size: 14.5px; min-height: 34px; }
.land-foot a { color: var(--ink-2); font-weight: 700; white-space: nowrap; }
.hint a { color: inherit; font-weight: 700; }
.legal-body { max-width: 720px; margin: 0 auto; padding: 24px 20px 90px; }
.legal-body h1 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 5vw, 54px); line-height: 1.05; letter-spacing: -0.02em; margin: 18px 0 14px; }
.legal-body .lede { max-width: none; margin-bottom: 8px; }
.legal-sec { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 26px; }
.legal-sec h2 { font-family: var(--display); font-size: 25px; margin: 0 0 8px; }
.legal-sec p, .legal-sec li { color: var(--ink-2); font-size: 16.5px; line-height: 1.6; margin: 0 0 10px; }
.legal-sec ul { margin: 0 0 10px; padding-left: 22px; }

/* phone editor header: the title gets the row, the save status sits under it */
.ed-status.in-ttl { display: none; }
.work-head .ttl small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) {
  .ed .work-head > .ed-status { display: none; }
  .ed .work-head .ttl .proj { display: none; }
  .ed .work-head .ttl .ed-status.in-ttl { display: inline; }
  .ed .work-head .ttl { flex: 1; min-width: 0; }
  .ed .ed-title-in { width: 100%; }
  .land-nav { gap: 10px; }
}

/* chat: sending / sent / seen by, under your latest message */
.msg .msg-st { grid-column: 2; justify-self: start; display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; padding: 2px 0; border: 0; background: none; font: inherit; font-size: 12.5px; color: var(--ink-3); cursor: pointer; text-align: left; }
.msg div.msg-st { cursor: default; }
.msg .msg-st .ico { width: 14px; height: 14px; flex: none; }
.msg .msg-st.seen { color: var(--ok); font-weight: 600; }
.msg button.msg-st:hover span { text-decoration: underline; }

/* ink-ring sprint timer */
.clock-row { display: flex; align-items: center; gap: 18px; margin-top: 10px; }
.ink-ring { flex: none; display: block; }
.ink-ring circle { fill: none; stroke-width: 7; }
.ink-ring .track { stroke: var(--line); }
.ink-ring .ink { stroke: var(--red); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
.ink-ring.waiting .track { stroke-dasharray: 3 9; stroke-linecap: round; }
.ink-ring.small circle { stroke-width: 9; }
@media (prefers-reduced-motion: reduce) { .ink-ring .ink { transition: none; } }
@media (max-width: 560px) { .clock-row { gap: 12px; } .clock-row .ink-ring { width: 72px; height: 72px; } }
.check-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 15px; cursor: pointer; }
.check-row input { width: 18px; height: 18px; accent-color: var(--red); }

/* text size */
.page { font-size: calc(1.19rem * var(--page-scale, 1)); }
.pad textarea { font-size: calc(1.19rem * var(--page-scale, 1)); }
.fs-sample { font-family: var(--display); font-size: calc(1.19rem * var(--page-scale, 1)); line-height: 1.7; margin: 16px 0 0; padding: 14px 16px; background: var(--card-2); border-radius: 6px; }
.ed-tools .aa { font-family: var(--display); font-weight: 800; font-size: 17px; width: auto; padding: 0 8px; }

/* circle header: members on phones get the room back for the chat */
@media (max-width: 560px) {
  .cv-head.is-member .cv-top p { display: none; }
  .cv-head.is-member .cv-top .ringmark { width: 40px !important; height: 40px !important; font-size: 40px !important; }
  .cv-head.is-member .cv-top h1 { font-size: 23px; padding-top: 6px; }
  .cv-head.is-member .cv-meta { margin-top: 6px; }
  .cv-head.is-member .crumb { margin-bottom: 2px; }
}

/* teaser on the welcome page */
.teaser { display: grid; gap: 26px; align-items: center; padding-top: 64px; padding-bottom: 72px; }
.teaser + .steps { border-top: 1px solid var(--line); }
.pillars + .teaser { border-top: 1px solid var(--line); }
.teaser-copy p { color: var(--ink-2); font-size: 17.5px; line-height: 1.6; max-width: 46ch; margin: 0; }
.teaser-frame { justify-self: center; width: min(100%, 420px); }
.teaser-video { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; border-radius: 14px; background: var(--card-2); box-shadow: 0 30px 60px -40px rgba(var(--shadow), .8); }
@media (min-width: 860px) { .teaser { grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 56px; } }

@media (max-width: 560px) { .land-lang { max-width: 104px; padding: 6px 4px; } }

/* notifications offer above the chat composer */
.notify-offer { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 14.5px; }
.notify-offer > .ico { color: var(--red); flex: none; }
.notify-offer .ibtn { width: 32px; height: 32px; }

</style>
</head>

const isPlain = v => v !== null && typeof v === 'object' && Object.getPrototypeOf(v) === Object.prototype;

function LocalDB(KEY) {

  const clone = v => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));

  const colDocs = col => { const n = segs(col).length + 1; return Object.keys(store).filter(p => p.startsWith(col + '/') && segs(p).length === n).map(snapDoc); };
  const cmp = (x, op, v) => {
    switch (op) {
      case '==': return x === v; case '!=': return x !== v; case '<': return x < v; case '<=': return x <= v;
      case '>': return x > v; case '>=': return x >= v; case 'in': return Array.isArray(v) && v.includes(x);
      case 'not-in': return Array.isArray(v) && !v.includes(x); case 'array-contains': return Array.isArray(x) && x.includes(v);
      case 'array-contains-any': return Array.isArray(x) && Array.isArray(v) && v.some(y => x.includes(y));

    }
  };
  const run = q => {
    let docs = colDocs(q.path);

        const x = getPath(a.data() || {}, f), y = getPath(b.data() || {}, f);

  };

      get: async () => snapDoc(path),
      set: async data => { if (!isPlain(data)) return fail('invalid_argument', 'Body must be an object'); write(path, strip(data)); },
      merge: async data => { const d = clone(store[path] || {}); mergeDeep(d, data); write(path, d); },

          last = ser;

  }

  }

}

const sketchImageCache = new Map();
async function sketchImage(sid) {
  if (sketchImageCache.has(sid)) return sketchImageCache.get(sid);
  const p = (async () => {
    const d = await dget(`sketches/${sid}/image/full`);
    if (d && typeof d.data === 'string' && DATA_IMG_RE.test(d.data)) return d.data;
    const sk = S.sketches.get(sid) || await dget('sketches/' + sid);
    return thumbSrc(sk) || '';

  sketchImageCache.set(sid, p);
  return p;
}
function hydrateSketches(root) {
  for (const img of $$('img[data-sketch]', root)) {
    const sid = img.getAttribute('data-sketch');
    if (!SKETCH_ID_RE.test(sid) || img.getAttribute('src')) continue;
    img.classList.add('loading-img');
    sketchImage(sid).then(src => { if (src) img.setAttribute('src', src); else img.classList.add('missing'); img.classList.remove('loading-img'); });

}
async function acquireLease(path, holder, withData) {
  try {

    if (withData) opts.data = { by: meId(), at: Date.now() };
    return (await P.db.doc(path).acquire(opts)) || { acquired: false };
  } catch (e) {
    if (e && e.code === 'denied') return { acquired: false, readonly: true };
    console.warn('Inkcircle: chapter lock unavailable, editing without it', e);
    return { acquired: true, unsupported: true };
  }
}

// Items shared with my circles live on each circle's shelf; load the ones of one type.
async function loadCircleShelf(type, pool) {
  const found = new Map();
  for (const c of myCircles().slice(0, 12)) {
    const shelf = await dlist(P.db.collection(`circles/${c.id}/shelf`).where('type', '==', type));
    for (const e of shelf.values()) {
      if (!e.id || found.has(e.id) || pool.get(e.id)) continue;
      const it = await dget(SHELF_COL[type] + '/' + e.id);
      if (it) found.set(it.id, it);
    }
  }
  return found;
}
function itemMembers(project) {
  const ids = [meId()];
  if (project) for (const id of projectPeople(project)) if (!ids.includes(id)) ids.push(id);
  return ids;
}
function projectSelect(current) {
  const mine = visibleProjects().filter(p => isItemMember(p));
  const sel = h('select', { class: 'inp', 'aria-label': 'Project' }, h('option', { value: '', text: 'Not linked to a project' }), mine.map(p => h('option', { value: p.id, raw: str(p.title, 80) })));
  if (current && mine.some(p => p.id === current)) sel.value = current;
  return sel;
}

  // ----- Muse sparks -----
  spark() {
    if (!museReady()) { toast('Muse is off for this visit.'); return; }
    const b = this.board() || {};
    const p = b.project ? S.projects.get(b.project) : null;
    const modes = [
      ['more', 'More ideas like these', 'Fresh ideas that build on the cards here.'],
      ['twists', 'What-if twists', 'Surprises that would raise the stakes.'],
      ['characters', 'Characters who cause friction', 'People with a want and a flaw.'],
      ['questions', 'Questions to answer', 'What you need to decide next.'],

    addBtn.disabled = true;
    const addPicked = async () => {
      const chosen = picks.filter(x => x.on);
      if (!chosen.length) return;
      s.close();
      const placed = [];
      for (const ch of chosen) {
        const [x, y] = this.freeSpot(placed);
        placed.push([x, y]);
        await dset(`boards/${this.bid}/cards/${newId()}`, { kind: ch.kind, text: ch.text, x, y, by: meId(), at: Date.now(), links: [], votes: {}, muse: true }, true);
      }

      this.touchBoard();
      toast(plural(chosen.length, 'card') + ' added.');
    };
    const paintPicks = () => {
      fill(results, ...picks.map((x, i) => h('button', {
        class: 'spark-item', type: 'button', role: 'checkbox', 'aria-checked': String(x.on), style: { '--k': `var(--k-${x.kind})` },

      }, h('span', { class: 'bx' }, x.on ? icon('check') : null), h('span', null, h('small', { text: KIND_LABEL[x.kind] }), h('span', { class: 'tx', text: x.text })))));
      addBtn.disabled = !picks.some(x => x.on);
    };
    const run = async mode => {
      if (ctl) ctl.abort();
      ctl = new AbortController();
      const mine = ctl;
      picks = []; paintPicks();
      status.textContent = T('Muse is thinking. This can take up to a minute.');
      const cards = Array.from(this.cards.values()).slice(0, 60).map(c => '- ' + cardKind(c.kind) + ': ' + str(c.text, 200).replace(/\s+/g, ' ')).join('\n');
      const ask = {
        more: 'Suggest fresh ideas that build on these cards, spread across different kinds.',
        twists: 'Suggest surprising what-if twists that would raise the stakes. Use kind "plot" or "idea".',
        characters: 'Suggest characters who would create friction with what is here, each with a want and a flaw, as kind "character".',
        questions: 'Ask probing questions the writer must answer to deepen this story, as kind "question".',
      }[mode];
      const prompt = `${MUSE_RULES}\n\nBoard: ${str(b.title, 100)}\n${p && canSee(p) ? `Project: ${str(p.title, 140)} (${str(p.kind, 40)}). Logline: ${str(p.logline, 300) || 'not given'}\n` : ''}Cards on the board:\n<draft>\n${cards || '(no cards yet)'}\n</draft>\n\nTask: ${ask}\nReply with only a JSON array of 6 objects shaped {"kind": "idea" | "character" | "place" | "plot" | "question", "text": string of at most 140 characters}. Example: [{"kind":"question","text":"What does she lose if the map is wrong?"}]`;
      try {
        const out = await askMuse(prompt, { json: true, signal: mine.signal });
        if (mine !== ctl) return;
        const list = Array.isArray(out) ? out : (out && Array.isArray(out.cards) ? out.cards : []);
        picks = list.filter(x => x && typeof x.text === 'string' && x.text.trim()).slice(0, 8).map(x => ({ kind: cardKind(x.kind), text: x.text.trim().slice(0, 240), on: true }));
        status.textContent = T(picks.length ? 'Tap a card to leave it out, then add the rest to the board.' : 'Muse came back empty. Try another kind of spark.');
        paintPicks();
      } catch (e) {
        if (mine !== ctl) return;
        status.textContent = T(museError(e));
        if (P.museOff) this.paintHead();
      } finally { if (ctl === mine) ctl = null; }
    };
    const body = h('div', null,
      h('p', { class: 'muted', style: { marginTop: '0' }, text: 'Muse reads the cards on this board and suggests new ones. Nothing is added until you choose.' }),
      h('div', { class: 'pick-list' }, modes.map(([k, t, sub]) => h('button', { class: 'row', type: 'button', onClick: () => run(k) }, icon('spark'), h('span', { class: 'grow' }, h('b', { text: t }), h('div', { class: 'small muted', text: sub }))))),
      status, results);
    const s = openSheet({ title: 'Spark ideas with Muse', body, size: 'lg', actions: [btn('Close', () => s.close(), 'ghost'), addBtn], onClose: () => { if (ctl) ctl.abort(); } });
  },
};

/* =====================================================================
   Illustrate: sketchbook, sketch page, drawing canvas.
   A sketch keeps a small thumbnail on its main record and the full
   image in sketches/{id}/image/full, so lists stay light.
   ===================================================================== */

let drawDraft = null;
const fullImageBytes = () => (P.mode === 'demo' ? 260000 : 600000);
const canEditSketch = sk => !!sk && (isItemMember(sk) || sk.owner === meId());
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = src; });
}
function canvasBlob(canvas, type = 'image/png', q) { return new Promise(res => { try { canvas.toBlob(b => res(b), type, q); } catch (e) { res(null); } }); }
function drawContain(ctx, img, W, H) {
  const s = Math.min(W / img.naturalWidth, H / img.naturalHeight);
  const w = img.naturalWidth * s, hh = img.naturalHeight * s;
  ctx.drawImage(img, (W - w) / 2, (H - hh) / 2, w, hh);
}
function compressCanvas(src, maxBytes) {
  let scale = 1;
  for (let i = 0; i < 7; i++) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(src.width * scale)); c.height = Math.max(1, Math.round(src.height * scale));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, 0, 0, c.width, c.height);
    for (const [type, q] of [['image/webp', 0.84], ['image/jpeg', 0.82]]) {
      const url = c.toDataURL(type, q);
      if (!url.startsWith('data:' + type)) continue;
      if (url.length * 0.75 < maxBytes) return url;
    }
    scale *= 0.78;
  }
  return null;
}
function makeThumb(src, maxW = 360, maxH = 300) {
  const s = Math.min(1, maxW / src.width, maxH / src.height);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(src.width * s)); c.height = Math.max(1, Math.round(src.height * s));
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
}
async function sketchBlob(sk, type = 'image/jpeg') {
  const src = await sketchImage(sk.id);
  if (!src) return null;
  const img = await loadImage(src);
  const c = document.createElement('canvas');
  const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return canvasBlob(c, type, 0.9);
}
function sketchForm(sk) {
  const title = h('input', { class: 'inp', maxlength: '120', value: str(sk.title, 120), placeholder: 'What is it?' });
  const caption = h('textarea', { class: 'inp', rows: '2', maxlength: '300', value: str(sk.caption, 300), placeholder: 'Optional: a line about it.' });
  const proj = projectSelect(sk.project);

  const el = h('div', null, field('Title', title), field('Caption', caption), field('Project', proj, 'Linked sketches appear on the project page, and its co-authors can draw on them.'), group('Who can see it', vis));
  el.read = () => Object.assign({ title: title.value.trim().slice(0, 120) || 'Untitled sketch', caption: caption.value.trim().slice(0, 300), project: proj.value || null }, vis.get());
  return el;
}

    [[true, 'Anyone on Inkcircle', 'Writers join with one tap.', 'globe'], [false, 'By approval', 'Writers ask to join and the host lets them in.', 'lock']].map(([v, t, sub, ic]) => h('button', { type: 'button', class: 'radio', role: 'radio', dataset: { v: String(v) }, onClick: () => { open = v; paint(); } }, icon(ic), h('span', null, h('b', { text: t }), h('small', { text: sub })))));
  const paint = () => { for (const b of radios.children) b.setAttribute('aria-checked', String(b.dataset.v === String(open))); };

  el.read = () => ({ name: name.value.trim().slice(0, 60), about: about.value.trim().slice(0, 400), tags: tags.get().slice(0, 8), open, color: color.get() });
  el.nameIn = name;
  return el;
}
async function joinCircle(c) {
  if (!signedIn() || !c) return false;
  const st = memberState(meId(), c);
  if (st !== 'none') return true;
  const ok = await dupdate('circles/' + c.id, { ['members.' + meId()]: c.open === false ? 'pending' : 'member' });
  if (ok) toast(c.open === false ? 'Request sent. The host will let you in.' : fmt('You joined {0}.', str(c.name, 60)));
  return ok;
}
async function leaveCircle(c) {
  const pending = memberState(meId(), c) === 'pending';
  const yes = await confirmSheet(pending
    ? { title: 'Cancel your request?', text: 'You can ask to join again later.', ok: 'Cancel request', danger: false }
    : { title: 'Leave this circle?', text: 'You can join again later.', ok: 'Leave circle', danger: false });
  if (yes && await dupdate('circles/' + c.id, { ['members.' + meId()]: DEL })) { toast(pending ? 'Request cancelled.' : fmt('You left {0}.', str(c.name, 60))); go('#circles'); }
}
function newCircleSheet() {
  const form = circleForm({});
  const create = async () => {
    const d = form.read();
    if (!d.name) { form.nameIn.focus(); toast('Give your circle a name.'); return; }
    const id = newId(), now = Date.now();
    if (!await dset('circles/' + id, Object.assign(d, { owner: meId(), members: { [meId()]: 'member' }, created: now, updated: now }))) return;
    s.close();
    toast(fmt('{0} is open. Invite a few writers.', str(d.name, 60)));
    go('#c-' + id);
  };
  const s = openSheet({ title: 'Start a circle', body: form, actions: [btn('Cancel', () => s.close(), 'ghost'), btn('Start circle', create, 'primary')] });
}
function circleLink(c) { return location.origin + location.pathname + '#c-' + c.id; }
// Invite links join the circle as soon as the writer has signed in.
function joinLink(c) { return location.origin + location.pathname + '#join-' + c.id; }
function waButton(label, text, cls = '') {
  return h('a', { class: 'btn wa ' + cls, href: waLink(text), target: '_blank', rel: 'noopener' }, icon('send'), h('span', { text: label }));
}
// Demo only: the example writers "read" what you send after a few seconds.
function demoSeen(c, at) {
  const others = membersOf(c).filter(id => id !== meId() && /^demo-/.test(id)).slice(0, 2);
  others.forEach((id, i) => setTimeout(() => dset(`circles/${c.id}/reads/${id}`, { at, seen: Date.now() }, true), 3500 + i * 5000));
}
async function autoJoin(cid) {
  const c = S.circles.get(cid) || await dget('circles/' + cid);
  if (c && signedIn() && memberState(meId(), c) === 'none') await joinCircle(c);
}
function inviteSheet(c) {
  if (P.mode !== 'firebase') {
    const s = openSheet({
      title: 'Invite writers', body: h('div', null,
        h('p', { class: 'muted', style: { marginTop: '0' }, text: 'This is the demo, so it only lives in your browser. On the live site, every circle has a link you can send: writers open it, sign in with Google or their email, and land right here.' })),
      actions: [btn('Close', () => s.close(), 'ghost')],
    });
    return;
