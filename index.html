    if (memberState(meId(), c) !== 'none' && c.owner !== meId()) inner.appendChild(h('div', { style: { marginTop: '22px' } }, btn(memberState(meId(), c) === 'pending' ? 'Cancel my request' : 'Leave circle', () => leaveCircle(c), 'ghost small', 'leave')));
    fill(this.panel, inner);
  },
  memberMenu(c, uid) {
    const s = openSheet({
      title: People.name(uid), body: h('div', { class: 'pick-list' },
        h('button', { class: 'row', type: 'button', onClick: () => { s.close(); openProfile(uid); } }, icon('user'), h('span', { class: 'grow', text: 'View profile' })),
        h('button', { class: 'row', type: 'button', onClick: async () => {
          s.close();
          if (await confirmSheet({ title: 'Remove from the circle?', text: People.name(uid) + ' will lose access to the chat and anything shared only with this circle.', ok: 'Remove' })) dupdate('circles/' + c.id, { ['members.' + uid]: DEL });
        } }, icon('leave'), h('span', { class: 'grow', text: 'Remove from the circle' }))),
    });
  },
  menu(c) {
    const opt = (ic, t, fn) => h('button', { class: 'row', type: 'button', onClick: () => { s.close(); fn(); } }, icon(ic), h('span', { class: 'grow', text: t }));
    const st = memberState(meId(), c);
    const items = [
      st === 'member' ? opt('people', 'Invite writers', () => inviteSheet(c)) : null,
      P.mode === 'firebase' ? opt('link', 'Copy link to this circle', () => copyText(circleLink(c), 'Link copied.')) : null,
      isHost(c) ? opt('settings', 'Edit circle', () => this.edit(c)) : null,
      st !== 'none' && c.owner !== meId() ? opt('leave', st === 'pending' ? 'Cancel my request' : 'Leave circle', () => leaveCircle(c)) : null,
      isHost(c) ? opt('trash', 'Close this circle', () => this.remove(c)) : null,
    ].filter(Boolean);
    const s = openSheet({ title: str(c.name, 60), body: items.length ? h('div', { class: 'pick-list' }, items) : h('p', { class: 'muted', text: 'Nothing to change here.' }) });
  },
  edit(c) {
    const form = circleForm(c);
    const save = async () => { const d = form.read(); if (!d.name) { form.nameIn.focus(); return; } d.updated = Date.now(); if (await dupdate('circles/' + c.id, d)) { s.close(); toast('Circle saved.'); } };
    const s = openSheet({ title: 'Edit circle', body: form, actions: [btn('Cancel', () => s.close(), 'ghost'), btn('Save changes', save, 'primary')] });
  },
  async remove(c) {
    const yes = await confirmSheet({ title: 'Close this circle?', text: fmt('"{0}" and its chat will be deleted for everyone. Projects shared with it stay with their authors.', str(c.name, 60)), ok: 'Close circle' });
    if (!yes) return;
    toast('Closing the circle…');
    for (const sub of ['messages', 'sprints', 'shelf']) {
      const docs = await dlist(P.db.collection(`circles/${c.id}/${sub}`));
      for (const id of docs.keys()) await ddel(`circles/${c.id}/${sub}/${id}`, true);
    }
    if (await ddel('circles/' + c.id)) { toast('Circle closed.'); go('#circles'); }
  },
};

// ---------- cheers ----------
let lastCheer = 0;
function sendCheer(cid, to) {
  if (!P.live) return;
  if (Date.now() - lastCheer < 2500) { toast('Cheer sent. Give it a moment before the next one.'); return; }
  lastCheer = Date.now();
  const c = S.circles.get(cid);
  const targets = to ? [to] : membersOf(c).filter(id => id !== meId());
  if (!targets.length) { toast("There's nobody else here to cheer on yet."); return; }
  try { P.live.cheer(targets, { c: cid, to: to || null }); } catch (e) { /* live unavailable */ }
  toast(to ? fmt('You cheered {0} on.', People.name(to)) : 'You cheered everyone on.');
}
function onCheer(v) {
  if (!v || typeof v.c !== 'string' || v.by === meId() || isBlocked(v.by)) return;
  const c = S.circles.get(v.c);
  if (!c || memberState(meId(), c) !== 'member') return;
  const to = typeof v.to === 'string' ? v.to : null;
  if (to && to !== meId()) return;
  toast(to ? fmt('{0} cheered you on in {1}.', People.name(v.by), str(c.name, 40)) : fmt('{0} cheered everyone on in {1}.', People.name(v.by), str(c.name, 40)));
}

// ---------- sprint pad ----------
Views.pad = {
  fill: true, focus: true,
  mount(el, [cid]) {
    Object.assign(this, { el, cid, alive: true, built: false, finished: false, counted: 0, sp: null, doc: null });
    this.saveSoon = debounce(() => this.savePad(), 2500);
    this.reportSoon = throttle(w => setPresence({ spr: { s: this.sp && this.sp.id, c: this.cid, w } }), 1000);
    this.unsub = watch(P.db.doc('circles/' + cid), snap => { if (snap.exists) S.circles.putOne('view', Object.assign({ id: snap.id }, snap.data())); else this.missing = true; this.tryBuild(); }, 'circle', () => { this.missing = true; this.tryBuild(); });
    fill(this.el, h('div', { class: 'wrap' }, skeleton(2)));
  },
  unmount() {
    this.alive = false;
    if (this.saveSoon) this.saveSoon.cancel();
    if (this.docUnsub) this.docUnsub();
    if (this.unsub) this.unsub();
    if (this.ta && this.sp && this.built) { if (!this.finished) this.recordWords(); this.savePad(); }
    setPresence({ spr: null });
    S.circles.drop('view');
  },
  update(k) {
    if (!this.built && k.has('circles')) this.tryBuild();
    if (this.built && (k.has('peers') || k.has('people'))) this.paintPeers();
  },
  tryBuild() {
    if (this.built || !this.alive) return;
    const c = S.circles.get(this.cid);
    if (!c) { if (this.missing) fill(this.el, h('div', { class: 'wrap' }, emptyState("This circle isn't here.", 'circles', btn('Circles', () => go('#circles'), 'dark')))); return; }
    const sp = sprintOf(c);
    if (sp && sp.upcoming) {
      this.waiting = true;
      fill(this.el, h('div', { class: 'wrap' }, crumb(str(c.name, 40), '#c-' + c.id), emptyState(fmt('The sprint starts {0}. This page opens by itself when it does.', whenLabel(sp.at)), 'circles', btn('Back to the circle', () => openCircle(c.id, 'sprint'), 'dark'))));
      return;
    }
    if (!sp || !sp.running) {
      fill(this.el, h('div', { class: 'wrap' }, crumb(str(c.name, 40), '#c-' + c.id), emptyState('No sprint is running in this circle right now.', 'circles', btn('Start one', () => openCircle(c.id, 'sprint'), 'dark', 'timer'))));
      return;
    }
    if (memberState(meId(), c) !== 'member') { openCircle(c.id, 'sprint'); return; }
    this.sp = sp;
    this.built = true;
    this.build(c, sp);
  },
  async build(c, sp) {
    this.clk = h('span', { class: 'clk num', dataset: { end: String(sp.end) }, text: clock(sp.left) });
    this.wc = h('span', { class: 'wc num', text: plural(0, 'word') });
    this.peersEl = h('div', { class: 'pad-peers', 'aria-label': 'Who is writing' });
    this.ta = h('textarea', { 'aria-label': 'Sprint page', placeholder: 'Write without stopping. Nobody sees your words, only the count.', spellcheck: 'true' });
    this.ta.addEventListener('input', () => this.onInput());
    this.doneBtn = btn("I'm done", () => this.finish(), 'small dark');
    fill(this.el, h('div', { class: 'pad' },
      h('div', { class: 'pad-top' }, ibtn('back', 'Back to the circle', () => openCircle(this.cid, 'sprint')), this.ring = inkRing(sp.at, sp.end, 34, 'small'), this.clk, this.wc, h('span', { class: 'grow' }), this.doneBtn),
      this.peersEl,
      sp.prompt ? h('div', { class: 'prompt', text: sp.prompt }) : null,
      this.ta));
    this.docUnsub = watch(P.db.doc(`circles/${this.cid}/sprints/${sp.id}`), snap => { this.doc = snap.exists ? snap.data() : null; this.paintPeers(); }, 'sprint', () => {});
    const pad = await dget(padPath());
    if (!this.alive) return;
    if (pad && pad.sprint === sp.id && typeof pad.text === 'string') {
      this.ta.value = pad.text;
      this.counted = Number(pad.counted) || 0;
      if (pad.done) { this.finished = true; this.ta.readOnly = true; this.doneBtn.disabled = true; }
    }
    this.onInput(true);
    if (!isTouch() && !this.finished) this.ta.focus();
    this.paintPeers();
  },
  words() { return countWords(this.ta ? this.ta.value : ''); },
  onInput(initial) {
    const w = this.words();
    this.wc.textContent = plural(w, 'word');
    if (!this.finished) this.reportSoon(w);
    if (!initial) this.saveSoon();
    this.paintPeers();
  },
  savePad() {
    if (!signedIn() || !this.sp || !this.ta) return;
    dset(padPath(), { sprint: this.sp.id, circle: this.cid, text: this.ta.value.slice(0, 120000), words: this.words(), counted: this.counted, done: this.finished, at: Date.now() }, true);
  },
  tick() {
    if (!this.built && this.waiting) { const sp = sprintOf(S.circles.get(this.cid)); if (sp && sp.running) { this.waiting = false; this.tryBuild(); } }
    if (!this.built || !this.sp) return;
    const left = this.sp.end - Date.now();
    this.clk.textContent = clock(left);
    if (this.ring) paintRing(this.ring);
    if (left <= 0 && !this.finished) this.finish(true);
  },
  recordWords() {
    const w = this.words();
    if (w > this.counted) { addWords(w - this.counted); this.counted = w; }
    return w;
  },
  async finish(timeUp) {
    if (this.finished) return;
    this.finished = true;
    this.ta.readOnly = true;
    this.doneBtn.disabled = true;
    const w = this.recordWords();
    this.saveSoon.cancel();
    this.savePad();
    setPresence({ spr: null });
    bumpCounter('sprints');
    await dupdate(`circles/${this.cid}/sprints/${this.sp.id}`, { ['results.' + meId()]: { w, at: Date.now() } }, true);
    if (!this.alive) return;
    const text = this.ta.value;
    const body = h('div', null,
      h('div', { class: 'clock', style: { fontSize: '64px' }, text: num(w) }),
      h('p', { class: 'muted', text: (timeUp ? T("Time's up.") + ' ' : '') + fmt('You wrote {0} in this sprint. They count toward your words today.', plural(w, 'word')) }));
    const s = openSheet({
      title: timeUp ? "Time's up" : 'Sprint finished', body,
      actions: [
        btn('Back to the circle', () => { s.close(); openCircle(this.cid, 'sprint'); }, 'ghost'),
        text.trim() ? btn('Copy my text', () => copyText(text), '', 'copy') : null,
        text.trim() ? btn('Save as a new chapter', () => { s.close(); this.saveToProject(text, w); }, 'primary', 'write') : null,
      ].filter(Boolean),
    });
  },
  saveToProject(text, w) {
    const mine = visibleProjects().filter(p => canEditProject(p));
    if (!mine.length) { toast('Start a project first, then you can move sprint pages into it.'); return; }
    const pick = async p => {
      s.close();
      const chs = sortedChapters(await dlist(P.db.collection(`projects/${p.id}/chapters`)));
      const order = chs.reduce((m, c) => Math.max(m, Number(c.order) || 0), 0) + 1;
      const title = T('Sprint') + ', ' + new Date().toLocaleDateString(LOCALE, { day: 'numeric', month: 'short' });
      const id = await createChapter(p.id, title, order, sanitizeHtml(textToHtml(text)), w);
      if (!id) return;
      dupdate('projects/' + p.id, { words: (Number(p.words) || 0) + w, updated: Date.now(), updatedBy: meId() }, true);
      toast(fmt('Saved to {0}.', str(p.title, 60)));
      go(`#ch-${p.id}-${id}`);
    };
    const s = openSheet({ title: 'Which project?', body: h('div', { class: 'pick-list' }, mine.map(p => h('button', { class: 'row', type: 'button', onClick: () => pick(p) }, h('span', { class: 'spine', style: { background: ink(p.color), minHeight: '28px' } }), h('span', { class: 'grow' }, h('b', { raw: str(p.title, 100) }), h('div', { class: 'small muted', text: str(p.kind, 40) }))))) });
  },
  paintPeers() {
    if (!this.peersEl || !this.sp) return;
    const rows = new Map();
    for (const p of S.peers) {
      const pr = p && p.presence;
      if (pr && pr.spr && pr.spr.s === this.sp.id) { const id = p.isMe ? meId() : (p.by || pr.uid); if (id) rows.set(id, Math.max(rows.get(id) || 0, Number(pr.spr.w) || 0)); }
    }
    for (const [uid, r] of Object.entries((this.doc && this.doc.results) || {})) if (r) rows.set(uid, Math.max(rows.get(uid) || 0, Number(r.w) || 0));
    rows.set(meId(), Math.max(rows.get(meId()) || 0, this.words()));
    const ranked = Array.from(rows.entries()).sort((a, b) => b[1] - a[1]);
    fill(this.peersEl, ...ranked.map(([uid, w]) => h('span', { class: 'pp' }, avatar(uid, 22), h('span', { text: uid === meId() ? 'You' : firstName(People.name(uid)) }), h('b', { class: 'num', text: num(w) }))));
  },
};

/* =====================================================================
   Boot: pick a backend, start the signed-in session, route.
   ===================================================================== */

function validConfig(cfg) {
  const f = cfg && cfg.firebase;
  return !!(f && typeof f.apiKey === 'string' && f.apiKey.length > 10 && f.apiKey !== 'PASTE_API_KEY_HERE'
    && typeof f.projectId === 'string' && f.projectId.length > 2 && f.projectId !== 'your-project-id');
}
function applyPatch(t, p) {
  for (const k of Object.keys(p)) {
    const v = p[k];
    if (v === DEL) delete t[k];
    else if (v && typeof v === 'object' && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== 'object') t[k] = {}; applyPatch(t[k], v); }
    else t[k] = v;
  }
  return t;
}

// ---------- the signed-in session ----------
let session = null;
function stopSession() {
  if (!session) return;
  session.unsubs.forEach(u => { try { u(); } catch (e) { /* ignore */ } });
  session = null;
  for (const pool of [S.circles, S.projects, S.boards, S.sketches]) pool.clear();
  S.ready.clear();
  S.peers = [];
  S.state = null;
  S.profile = null;
}
function startSession() {
  const uid = meId();
  if (session && session.uid === uid) return;
  stopSession();
  const unsubs = [];
  session = { uid, unsubs, onboarded: false, createdWriter: false };
  const ready = key => { if (!S.ready.has(key)) { S.ready.add(key); emitChange(key); } };
  unsubs.push(watch(P.db.doc('writers/' + uid), snap => {
    S.profile = snap.exists ? snap.data() : null;
    if (S.profile) People.remember(uid, S.profile);
    emitChange('profile');
    emitChange('people');
    if (!snap.exists && !(snap.metadata && snap.metadata.fromCache) && !session.createdWriter && P.mode === 'firebase') {
      session.createdWriter = true;
      updateMyWriter({});
    }
    if (S.profile && !S.profile.onboarded && P.mode === 'firebase' && !session.onboarded) {
      session.onboarded = true;
      setTimeout(() => { if (signedIn() && current && current.name !== 'landing') runOnboarding(); else session.onboarded = false; }, 400);
    }
  }, 'profile', () => {}));
  unsubs.push(watch(P.db.doc(statePath()), snap => {
    const base = snap.exists ? (snap.data() || {}) : {};
    S.state = applyPatch(JSON.parse(JSON.stringify(base)), pendingState);
    emitChange('state');
  }, 'state', () => { S.state = S.state || {}; emitChange('state'); }));
  unsubs.push(watch(P.db.collection('circles').where(`members.${uid}`, 'in', ['member', 'pending']), snap => { S.circles.put('mine', toMap(snap)); ready('circles'); }, 'circles', () => ready('circles')));
  for (const [col, pool] of [['projects', S.projects], ['boards', S.boards], ['sketches', S.sketches]]) {
    unsubs.push(watch(P.db.collection(col).where('members', 'array-contains', uid), snap => { pool.put('mine', toMap(snap)); ready(col); }, col, () => ready(col)));
  }
  if (P.live) {
    try {
      unsubs.push(P.live.onPeers(ch => { S.peers = (ch && ch.peers) || []; emitChange('peers'); }));
      unsubs.push(P.live.onCheer(onCheer));
    } catch (e) { /* live presence unavailable */ }
    setPresence({ uid });
  }
}

// ---------- auth ----------
function takeInvite() {
  let cid = '';
  try { cid = localStorage.getItem('ink-invite') || ''; localStorage.removeItem('ink-invite'); } catch (e) { /* ignore */ }
  return /^[a-z0-9]+$/.test(cid) ? cid : '';
}
function takeNext() {
  let next = '';
  try { next = localStorage.getItem('ink-next') || ''; localStorage.removeItem('ink-next'); } catch (e) { /* ignore */ }
  return /^#[a-z0-9-]+$/.test(next) && next !== '#welcome' ? next : '';
}
let firstAuth = true;
function onAuth(user) {
  const wasLoading = P.mode === 'loading';
  if (wasLoading) P.mode = 'firebase';
  if (user) {
    startSession();
    setTimeout(() => syncPush(false), 4000);
    const invite = takeInvite();
    if (invite) {
      autoJoin(invite);
      if (!/^#c-/.test(location.hash)) { location.hash = '#c-' + invite; return; }
    }
    const next = takeNext();
    if (next && location.hash !== next) { location.hash = next; return; }
    if (location.hash === '#welcome' && !firstAuth) location.hash = '#desk';
  } else {
    stopSession();
  }
  firstAuth = false;
  emitChange('auth');
  route();
}

// ---------- boot ----------
async function boot() {
  initLang();
  applyTheme();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme()); } catch (e) { /* older browsers */ }
  renderShell();
  fill($('#main'), h('div', { class: 'boot' }, markSvg(true), h('p', { class: 'muted', text: 'Opening Inkcircle…' })));
  document.body.classList.add('public');
  onChange(kinds => {
    updateChrome();
    if (kinds.has('circles') || kinds.has('people')) checkNotify();
    if (current && current.view.update) { try { current.view.update(kinds); } catch (e) { console.error(e); } }
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('online', () => { P.online = true; emitChange('net'); });
  window.addEventListener('offline', () => { P.online = false; emitChange('net'); });
  setInterval(() => { if (current && current.view.tick) { try { current.view.tick(); } catch (e) { console.error(e); } } }, 1000);
  setInterval(() => { if (signedIn()) { updateChrome(); rollSprints(); } }, 20000);
  setInterval(() => { if (signedIn()) checkNotify(); }, 5000);
  // a tap on a notification opens the right page
  try { navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'go' && typeof e.data.hash === 'string' && /^#[\w-]*$/.test(e.data.hash)) location.hash = e.data.hash; }); } catch (e) { /* no service worker */ }

  const cfg = window.INKCIRCLE_CONFIG;
  P.hasFirebase = validConfig(cfg);
  P.site = !!document.querySelector('link[rel="manifest"]');
  P.contact = cfg && typeof cfg.contact === 'string' ? cfg.contact.trim().slice(0, 120) : '';
  P.pushUrl = cfg && typeof cfg.push === 'string' && /^https:\/\/[\w.-]+(:\d+)?\/?$/.test(cfg.push.trim()) ? cfg.push.trim().replace(/\/$/, '') : '';
  if (window.__INK_TEST__ && cfg && typeof cfg.push === 'string') P.pushUrl = cfg.push.replace(/\/$/, '');
  if (P.site && 'serviceWorker' in navigator && (location.protocol === 'https:' || window.__INK_TEST__)) navigator.serviceWorker.register('sw.js').catch(() => {});
  P.preview = !!(window.claude && typeof window.claude.use === 'function');
  let wantDemo = false;
  try { wantDemo = localStorage.getItem('ink-demo') === '1'; } catch (e) { /* ignore */ }

  if (P.hasFirebase && !wantDemo) {
    const ok = await startFirebase(cfg, onAuth);
    if (!ok) {
      P.mode = 'error';
      document.body.classList.add('public');
      fill($('#main'), h('div', { class: 'wrap boot-err' }, markSvg(false), h('h1', { text: "Inkcircle couldn't load." }),
        h('p', { class: 'muted', text: 'Check your connection and reload the page. If it keeps happening, an ad blocker may be blocking the sign-in service.' }),
        h('div', { class: 'acts-row' }, btn('Reload', () => location.reload(), 'primary'), btn('Try the demo', startDemoFromLanding, 'ghost'))));
      return;
    }
  } else {
    await startDemo();
    P.mode = 'demo';
    startSession();
    let seen = false;
    try { seen = localStorage.getItem('ink-seen') === '1'; } catch (e) { /* ignore */ }
    if (!seen && !wantDemo && !location.hash) history.replaceState(null, '', '#welcome');
    route();
  }
  if (window.__INK_TEST__) window.__ink = { S, P, go, Views, People, dget, dset, dupdate, rollSprints, current: () => current };
}
boot();

})();
